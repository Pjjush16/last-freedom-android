<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Last Freedom Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif; }
        #map {
            width: 100%;
            height: 100%;
            filter: brightness(0.85) contrast(1.1) saturate(0.7) hue-rotate(10deg);
        }

        /* ===== 天气效果 ===== */
        #weather-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 1000;
            transition: opacity 0.5s; opacity: 0;
        }
        #weather-overlay.fog {
            background: radial-gradient(ellipse at center, transparent 30%, rgba(180,180,180,0.6) 100%);
            opacity: 1;
        }
        #weather-overlay.rain {
            background: repeating-linear-gradient(transparent, transparent 4px, rgba(150,200,255,0.1) 4px, rgba(150,200,255,0.1) 5px);
            opacity: 1; animation: rain-fall 0.3s linear infinite;
        }
        @keyframes rain-fall { 0% { background-position: 0 0; } 100% { background-position: 0 20px; } }

        /* ===== 选点准星（高德风格：固定居中） ===== */
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1010; pointer-events: none;
            width: 100px; height: 100px;
            transition: opacity 0.3s;
        }
        #crosshair.hidden { opacity: 0; }
        #crosshair .ring {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px; border-radius: 50%;
            border: 2px solid rgba(79, 156, 255, 0.7);
            box-shadow: 0 0 16px rgba(79, 156, 255, 0.25), inset 0 0 10px rgba(79, 156, 255, 0.1);
            animation: xPulse 2.5s ease-in-out infinite;
        }
        @keyframes xPulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
        #crosshair .inner {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 18px; height: 18px; border-radius: 50%;
            border: 1.5px solid rgba(79, 156, 255, 0.5);
        }
        #crosshair .dot {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 5px; height: 5px; border-radius: 50%;
            background: #4f9cff;
            box-shadow: 0 0 8px #4f9cff;
        }
        #crosshair .h-line { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(79,156,255,0.45); transform: translateY(-50%); }
        #crosshair .v-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(79,156,255,0.45); transform: translateX(-50%); }
        /* 四角 */
        #crosshair .c { position: absolute; width: 14px; height: 14px; border-color: rgba(79,156,255,0.5); border-style: solid; border-width: 0; }
        #crosshair .c-tl { top: 2px; left: 2px; border-top-width: 2px; border-left-width: 2px; }
        #crosshair .c-tr { top: 2px; right: 2px; border-top-width: 2px; border-right-width: 2px; }
        #crosshair .c-bl { bottom: 2px; left: 2px; border-bottom-width: 2px; border-left-width: 2px; }
        #crosshair .c-br { bottom: 2px; right: 2px; border-bottom-width: 2px; border-right-width: 2px; }

        /* ===== 顶部提示条 ===== */
        #pick-hint {
            position: fixed; top: 40px; left: 50%;
            transform: translateX(-50%);
            z-index: 1011;
            background: rgba(79, 156, 255, 0.12);
            border: 1px solid rgba(79, 156, 255, 0.3);
            border-radius: 20px;
            padding: 6px 18px;
            font-size: 12px; font-weight: 600;
            color: rgba(79, 156, 255, 0.95);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.3s, transform 0.3s;
            white-space: nowrap;
        }
        #pick-hint.hidden { opacity: 0; transform: translateX(-50%) translateY(-10px); pointer-events: none; }

        /* ===== 底部信息卡片 ===== */
        #bottom-card {
            position: fixed; bottom: 0; left: 0; right: 0;
            z-index: 1011;
            background: rgba(20, 26, 38, 0.94);
            border-top: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px 20px 0 0;
            padding: 14px 20px;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            display: flex; align-items: center; gap: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
        }
        #bottom-card .icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, #4f9cff, #6366f1);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(79, 156, 255, 0.3);
        }
        #bottom-card .info { flex: 1; min-width: 0; }
        #bottom-card .label { font-size: 9px; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.35); letter-spacing: 1.5px; margin-bottom: 3px; }
        #bottom-card .name { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #bottom-card .coord { font-size: 12px; font-weight: 600; color: #4f9cff; font-family: 'SF Mono', monospace; letter-spacing: 0.5px; margin-top: 2px; }
        #bottom-card .meta { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 1px; }
        #bottom-card .meta b { color: #4f9cff; font-weight: 600; }

        /* ===== 确认按钮 ===== */
        #confirm-btn {
            padding: 12px 24px; min-height: 48px;
            background: linear-gradient(135deg, #4f9cff, #6366f1);
            border: none; border-radius: 12px;
            color: #fff; font-size: 15px; font-weight: 700;
            cursor: pointer; white-space: nowrap;
            box-shadow: 0 4px 16px rgba(79, 156, 255, 0.4);
            transition: all 0.2s;
            position: relative; overflow: hidden;
        }
        #confirm-btn::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            background-size: 200% 100%; animation: shimmer 3s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        #confirm-btn:active { transform: scale(0.97); }
        #confirm-btn.go { background: linear-gradient(135deg, #ff5757, #dc2626); box-shadow: 0 4px 16px rgba(255,87,87,0.4); }

        /* ===== 蓝色信息条（游戏运行时用） ===== */
        #info-bar {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(0, 60, 140, 0.85);
            color: white; padding: 8px 16px;
            font-size: 14px; font-family: monospace;
            z-index: 1012; text-align: center;
            transition: opacity 0.3s;
        }
        #info-bar.hidden { opacity: 0; pointer-events: none; }

        /* ===== 黄色警告框 ===== */
        #warning-box {
            position: fixed; top: 40px; right: 10px;
            background: rgba(255, 200, 0, 0.9);
            color: #333; padding: 6px 10px;
            font-size: 11px; font-weight: bold;
            border-radius: 4px; z-index: 1012;
            line-height: 1.4;
        }

        /* ===== 地图源选择器（底部左侧） ===== */
        #map-src-select {
            position: fixed; bottom: 80px; left: 12px;
            z-index: 1011;
            background: rgba(20, 26, 38, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 4px;
            color: #fff; font-size: 11px;
            font-family: -apple-system, sans-serif;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            max-width: 180px;
        }
        #map-src-select.hidden { display: none; }

        /* 威胁圈动画 */
        .threat-circle-pulse { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>
    <div id="info-bar" class="hidden">📍 正在获取位置...</div>
    <div id="warning-box">安全驾驶<br>请勿超速<br>剧情演绎 游戏画面</div>
    <div id="weather-overlay"></div>

    <!-- 选点准星 -->
    <div id="crosshair">
        <div class="ring"></div>
        <div class="inner"></div>
        <div class="h-line"></div>
        <div class="v-line"></div>
        <div class="dot"></div>
        <div class="c c-tl"></div>
        <div class="c c-tr"></div>
        <div class="c c-bl"></div>
        <div class="c c-br"></div>
    </div>

    <!-- 选点提示 -->
    <div id="pick-hint">拖动地图 · 将准星对准逃跑目的地</div>

    <!-- 底部选点卡片 -->
    <div id="bottom-card">
        <div class="icon">🎯</div>
        <div class="info">
            <div class="label">逃跑目的地</div>
            <div class="name" id="card-name">拖动地图选择位置</div>
            <div class="coord" id="card-coord">--</div>
            <div class="meta" id="card-meta">缩放地图可精确定位</div>
        </div>
        <button id="confirm-btn" onclick="confirmDestination()">确认目的地</button>
    </div>

    <!-- 地图源选择 -->
    <select id="map-src-select" onchange="switchMapSource()">
        <option value="arcgis_sat">ArcGIS World Imagery（最清晰）</option>
        <option value="arcgis_clarity">ArcGIS Clarity（增强细节）</option>
        <option value="arcgis_firefly">ArcGIS Firefly（低饱和风格）</option>
        <option value="arcgis_wayback">ArcGIS Wayback（历史影像）</option>
    </select>

    <div id="map"></div>

    <script>
        // ===== 天地图 Key =====
        const params = new URLSearchParams(window.location.search);
        const TK = params.get('key') || '';

        // ===== 状态 =====
        let pickMode = true;       // true = 选点模式
        let debounceTimer = null;  // 防抖定时器
        let lastCoordUpdate = 0;

        // ===== 地图源配置 =====
        const MAP_SOURCES = {
            arcgis_sat: {
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                subs: [], maxZoom: 18
            },
            arcgis_clarity: {
                url: 'https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                subs: [], maxZoom: 18
            },
            arcgis_firefly: {
                url: 'https://fly.maptiles.arcgis.com/arcgis/rest/services/World_Imagery_Firefly/MapServer/tile/{z}/{y}/{x}',
                subs: [], maxZoom: 18
            },
            arcgis_wayback: {
                url: 'https://wayback-a.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/10/{z}/{y}/{x}',
                subs: [], maxZoom: 18
            }
        };

        let currentLayer = null;
        let overlayLayer = null;

        // ===== 初始化地图 =====
        const map = L.map('map', {
            center: [39.9042, 116.4074],
            zoom: 16,
            zoomControl: false,
            attributionControl: false,
            dragging: true,
            tap: true
        });

        // 加载默认地图源
        function loadMapSource(srcKey) {
            const src = MAP_SOURCES[srcKey];
            if (!src) return;

            // 清除旧图层
            if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }
            if (overlayLayer) { map.removeLayer(overlayLayer); overlayLayer = null; }

            // 处理高德特殊瓦片URL
            if (src.customSub) {
                const TileLayer = L.TileLayer.extend({
                    getTileUrl: function(coords) {
                        const sub = src.customSub(coords.x, coords.y);
                        return L.Util.template(src.url, L.extend({
                            x: sub, y: coords.y, z: this._getZoomForUrl()
                        }, this.options));
                    }
                });
                currentLayer = new TileLayer(src.url, { maxZoom: src.maxZoom }).addTo(map);
            } else {
                currentLayer = L.tileLayer(src.url, {
                    subdomains: src.subs.length > 0 ? src.subs : ['a','b','c'],
                    maxZoom: src.maxZoom
                }).addTo(map);
            }

            // 注记图层
            if (src.overlay) {
                overlayLayer = L.tileLayer(src.overlay, {
                    subdomains: ['0','1','2','3','4','5','6','7'],
                    maxZoom: src.maxZoom
                }).addTo(map);
            }

            // 保存到本地记忆
            try { localStorage.setItem('mapSrc', srcKey); } catch(e) {}
        }

        function switchMapSource() {
            const sel = document.getElementById('map-src-select');
            loadMapSource(sel.value);
        }

        // 加载上次选择的地图源
        try {
            const saved = localStorage.getItem('mapSrc');
            if (saved && MAP_SOURCES[saved]) {
                document.getElementById('map-src-select').value = saved;
                loadMapSource(saved);
            } else {
                loadMapSource('tianditu_sat');
            }
        } catch(e) {
            loadMapSource('tianditu_sat');
        }

        // ===== 玩家标记 =====
        let playerMarker = null;
        let playerIcon = L.divIcon({
            html: '<div style="font-size:32px;transform:rotate(0deg);transition:transform 0.3s;">🔺</div>',
            className: 'player-icon',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        // 终点标记
        let destMarker = null;

        // 威胁圈
        let threatCircle = null;
        let threatCircleFog = null;

        // ===== 高德风格选点：拖动地图 + 防抖更新 =====

        // 格式化坐标
        function fmtCoord(lat, lng) {
            const ns = lat >= 0 ? 'N' : 'S';
            const ew = lng >= 0 ? 'E' : 'W';
            return Math.abs(lat).toFixed(4) + '°' + ns + '  ' + Math.abs(lng).toFixed(4) + '°' + ew;
        }

        // 根据坐标猜测区域名（模拟逆地理编码）
        function guessLocation(lat, lng) {
            if (lat > 35 && lat < 42 && lng > 110 && lng < 120) return '中国境内';
            if (lat > 30 && lat < 50 && lng > -130 && lng < -100) return '北美地区';
            if (lat > 35 && lat < 45 && lng > 130 && lng < 150) return '日本附近';
            if (lat > 48 && lat < 60 && lng > -10 && lng < 40) return '欧洲地区';
            return '未知区域';
        }

        // 地图开始拖动
        map.on('movestart', function() {
            if (!pickMode) return;
            document.getElementById('card-name').textContent = '移动中...';
            document.getElementById('card-coord').textContent = '松开后定位';
        });

        // 地图拖动中（节流 100ms）
        map.on('move', function() {
            if (!pickMode) return;
            var now = Date.now();
            if (now - lastCoordUpdate > 100) {
                lastCoordUpdate = now;
                var c = map.getCenter();
                document.getElementById('card-coord').textContent = fmtCoord(c.lat, c.lng);
            }
        });

        // 地图停止移动（防抖 400ms）
        map.on('moveend', function() {
            if (!pickMode) return;
            if (debounceTimer) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function() {
                onMapIdle();
                debounceTimer = null;
            }, 400);
        });

        // 地图空闲 → 更新选点信息
        function onMapIdle() {
            if (!pickMode) return;
            var c = map.getCenter();
            var coordStr = fmtCoord(c.lat, c.lng);
            document.getElementById('card-name').textContent = guessLocation(c.lat, c.lng);
            document.getElementById('card-coord').textContent = coordStr;
            document.getElementById('card-meta').textContent = '缩放级别 ' + map.getZoom() + ' · 缩放越大定位越精确';

            // 通知 Android 端当前中心坐标
            if (window.AndroidBridge) {
                window.AndroidBridge.onMapCenterChanged(c.lat, c.lng);
            }
        }

        // 确认目的地
        function confirmDestination() {
            if (!pickMode) return;
            var c = map.getCenter();

            // 退出选点模式
            pickMode = false;
            document.getElementById('crosshair').classList.add('hidden');
            document.getElementById('pick-hint').classList.add('hidden');
            document.getElementById('map-src-select').classList.add('hidden');

            // 更新底部卡片为"准备出发"
            var card = document.getElementById('bottom-card');
            card.querySelector('.icon').textContent = '🚁';
            card.querySelector('.icon').style.background = 'linear-gradient(135deg, #6366f1, #8b5cf6)';
            document.getElementById('card-name').textContent = guessLocation(c.lat, c.lng);
            document.getElementById('card-coord').textContent = '';
            document.getElementById('card-meta').textContent = '';

            var btn = document.getElementById('confirm-btn');
            btn.textContent = '🏃 开始逃跑';
            btn.classList.add('go');

            // 通知 Android 端选点结果
            if (window.AndroidBridge) {
                window.AndroidBridge.onDestinationConfirmed(c.lat, c.lng);
            }
        }

        // 地图点击（仅非选点模式生效，作为后备）
        map.on('click', function(e) {
            if (pickMode) return; // 选点模式不响应点击
            if (window.AndroidBridge) {
                window.AndroidBridge.onMapClick(e.latlng.lat, e.latlng.lng);
            }
        });

        // ===== Android 调用的函数 =====

        function updatePlayer(lat, lng, bearing, speed) {
            if (!playerMarker) {
                playerMarker = L.marker([lat, lng], { icon: playerIcon }).addTo(map);
                if (pickMode) {
                    // 选点模式：不跟随玩家
                } else {
                    map.setView([lat, lng], 17);
                }
            } else {
                playerMarker.setLatLng([lat, lng]);
            }

            var arrowEl = playerMarker.getElement();
            if (arrowEl) {
                var div = arrowEl.querySelector('div');
                if (div) div.style.transform = 'rotate(' + bearing + 'deg)';
            }

            // 游戏模式：地图跟随
            if (!pickMode) {
                map.panTo([lat, lng], { animate: true, duration: 0.5 });
            }

            // 更新信息条（游戏运行时显示）
            var infoBar = document.getElementById('info-bar');
            infoBar.classList.remove('hidden');
            infoBar.textContent = '📍 ' + lat.toFixed(5) + ', ' + lng.toFixed(5) +
                ' | 🏎️ ' + speed.toFixed(0) + ' km/h';

            if (!window._mapReadySent) {
                window._mapReadySent = true;
                if (window.AndroidBridge) window.AndroidBridge.onMapReady();
            }
        }

        function setDestination(lat, lng) {
            if (destMarker) map.removeLayer(destMarker);
            destMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    html: '<div style="font-size:36px;">🏁</div>',
                    className: 'dest-icon',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                })
            }).addTo(map);
        }

        function updateCircle(centerLat, centerLng, radius, initialRadius) {
            if (threatCircle) map.removeLayer(threatCircle);
            threatCircle = L.circle([centerLat, centerLng], {
                radius: radius,
                color: '#ff3333', weight: 3,
                fillColor: '#ff0000', fillOpacity: 0.08,
                className: 'threat-circle-pulse'
            }).addTo(map);

            if (threatCircleFog) map.removeLayer(threatCircleFog);
            threatCircleFog = L.circle([centerLat, centerLng], {
                radius: radius * 1.3,
                color: '#ff0000', weight: 1,
                fillColor: '#ff0000', fillOpacity: 0.15,
                dashArray: '5, 10'
            }).addTo(map);
        }

        function clearDestination() {
            if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
            if (threatCircle) { map.removeLayer(threatCircle); threatCircle = null; }
            if (threatCircleFog) { map.removeLayer(threatCircleFog); threatCircleFog = null; }
        }

        function setWeather(type) {
            var overlay = document.getElementById('weather-overlay');
            overlay.className = '';
            if (type === 'fog' || type === 'rain') overlay.classList.add(type);
            setTimeout(function() { overlay.className = ''; }, 15000);
        }

        // 重置为选点模式
        function resetToPickMode() {
            pickMode = true;
            document.getElementById('crosshair').classList.remove('hidden');
            document.getElementById('pick-hint').classList.remove('hidden');
            document.getElementById('map-src-select').classList.remove('hidden');

            var card = document.getElementById('bottom-card');
            card.querySelector('.icon').textContent = '🎯';
            card.querySelector('.icon').style.background = 'linear-gradient(135deg, #4f9cff, #6366f1)';
            document.getElementById('card-name').textContent = '拖动地图选择位置';
            document.getElementById('card-coord').textContent = '--';
            document.getElementById('card-meta').textContent = '缩放地图可精确定位';

            var btn = document.getElementById('confirm-btn');
            btn.textContent = '确认目的地';
            btn.classList.remove('go');

            // 更新坐标
            onMapIdle();
        }

        // 地图就绪通知
        if (window.AndroidBridge) {
            window.AndroidBridge.onMapReady();
        }

        // 初始加载坐标
        setTimeout(onMapIdle, 500);
    </script>
    <!-- Esri 署名 -->
    <div style="position:fixed;bottom:4px;right:8px;z-index:9999;font-size:9px;color:rgba(255,255,255,0.5);pointer-events:none;">© Esri, Maxar, Earthstar Geographics</div>
</body>
</html>
