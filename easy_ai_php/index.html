<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Easy AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23327ac2'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
/* ============ Open WebUI 风格暗色主题 ============ */
:root{
  --gray-950:#0d0d0d;
  --gray-900:#17181c;
  --gray-850:#26272b;
  --gray-800:#333;
  --gray-750:#3a3b42;
  --gray-700:#44464e;
  --gray-600:#62667a;
  --gray-500:#8e92a4;
  --gray-400:#a5a8b8;
  --gray-300:#c4c7d4;
  --gray-100:#ececf1;
  --accent:#327ac2;
  --accent-2:#7c3aed;
  --danger:#ef4444;
  --sidebar-w:276px;
  --radius:16px;
  --hover:rgba(255,255,255,.07);
  --hover-strong:rgba(255,255,255,.11);
  --hover-card:#2b2c31;
  --border-soft:rgba(255,255,255,.06);
}
/* ============ 亮色主题 ============ */
body.light{
  --gray-950:#f5f5f5;
  --gray-900:#ebebeb;
  --gray-850:#f7f7f8;
  --gray-800:#ffffff;
  --gray-750:#e0e0e4;
  --gray-700:#d0d0d6;
  --gray-600:#9ca0ad;
  --gray-500:#767b8a;
  --gray-400:#5d6270;
  --gray-300:#3f4350;
  --gray-100:#17181c;
  --hover:rgba(0,0,0,.05);
  --hover-strong:rgba(0,0,0,.09);
  --hover-card:#ececef;
  --border-soft:rgba(0,0,0,.07);
}
body.light .orb::after{background:#fff}
body.light #toast{background:#17181c;color:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:var(--gray-850);color:var(--gray-100);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--gray-700);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

#app{display:flex;height:100dvh;width:100%}

/* ============ 侧边栏 ============ */
#sidebar{
  width:var(--sidebar-w);background:var(--gray-900);
  display:flex;flex-direction:column;flex-shrink:0;
  transition:margin-left .28s cubic-bezier(.4,0,.2,1);
  border-right:1px solid rgba(255,255,255,.03);
  z-index:60;
}
#app.sb-collapsed #sidebar{margin-left:calc(-1 * var(--sidebar-w))}
.sb-head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;background:none;border:none;color:var(--gray-100);padding:6px;border-radius:10px;text-align:left}
.brand:hover{background:var(--hover)}
.brand-name{font-weight:600;font-size:15px;letter-spacing:.3px;white-space:nowrap}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:none;background:transparent;
  color:var(--gray-500);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;flex-shrink:0;
}
.icon-btn:hover{background:var(--hover);color:var(--gray-100)}
.new-chat{
  margin:4px 12px 10px;display:flex;align-items:center;gap:9px;
  padding:10px 12px;border-radius:11px;cursor:pointer;
  background:var(--gray-850);border:1px solid var(--gray-750);
  color:var(--gray-100);font-size:13.5px;font-weight:500;
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.new-chat:hover{border-color:var(--gray-600);background:var(--hover-card);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.new-chat svg.ic{width:16px;height:16px;color:var(--gray-400)}
.sb-search{margin:0 12px 8px;display:flex;gap:6px}
.sb-search input{flex:1;min-width:0;padding:8px 12px;border-radius:9px;border:1px solid var(--gray-750);background:var(--gray-850);color:var(--gray-100);font-size:13px;outline:none;transition:border-color .15s}
.sb-search input:focus{border-color:var(--gray-600)}
.sb-search .icon-btn{width:35px;height:35px}
.chat-list{flex:1;overflow-y:auto;padding:2px 8px 8px}
.group-label{font-size:11.5px;color:var(--gray-500);padding:12px 10px 5px;font-weight:500}
.chat-item{
  display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;
  cursor:pointer;font-size:13.5px;color:var(--gray-300);position:relative;
  transition:background .15s;user-select:none;
}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--hover-strong);color:var(--gray-100)}
.chat-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .del{opacity:0;width:26px;height:26px;border:none;border-radius:7px;background:transparent;color:var(--gray-500);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s,background .15s,color .15s}
.chat-item:hover .del{opacity:1}
.chat-item .del:hover{background:rgba(239,68,68,.15);color:var(--danger)}
.chat-item .del svg.ic{width:15px;height:15px}
.empty-hint{color:var(--gray-600);font-size:12.5px;text-align:center;padding:26px 12px;line-height:1.7}
.sb-foot{padding:10px 12px;border-top:1px solid var(--border-soft)}
.sb-foot-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;border:none;background:transparent;color:var(--gray-300);font-size:13.5px;cursor:pointer;transition:background .15s;text-align:left}
.sb-foot-btn:hover{background:var(--hover)}

/* 迷你光球（品牌 logo） */
.orb{position:relative;width:26px;height:26px;flex-shrink:0}
.orb::before{content:'';position:absolute;inset:-2px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--accent),var(--accent-2),#ec4899,#f59e0b,var(--accent));
  animation:orbSpin 4.5s linear infinite;filter:blur(3px);opacity:.95}
.orb::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--gray-900)}
.orb.lg{width:64px;height:64px}
.orb.lg::before{inset:-4px;filter:blur(7px)}
.orb.lg::after{inset:11px;background:var(--gray-850)}
.orb .spark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;color:#fff}
.orb .spark svg.ic{width:55%;height:55%;fill:#fff;stroke:none;animation:sparkPulse 2.6s ease-in-out infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes sparkPulse{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.08);opacity:1}}

/* ============ 主区域 ============ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{height:54px;display:flex;align-items:center;gap:6px;padding:0 14px;flex-shrink:0}
.model-sel{position:relative}
.model-btn{
  display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;border:none;
  background:transparent;color:var(--gray-100);font-size:15px;font-weight:600;cursor:pointer;
  transition:background .15s;max-width:56vw;
}
.model-btn:hover{background:var(--hover)}
.model-btn .sub{color:var(--gray-500);font-weight:400;font-size:12.5px}
.model-btn svg.ic{width:14px;height:14px;color:var(--gray-500);transition:transform .2s}
.model-sel.open .model-btn svg.chev{transform:rotate(180deg)}
.model-menu{
  position:absolute;top:calc(100% + 6px);left:0;min-width:300px;max-width:86vw;
  background:var(--gray-800);border:1px solid var(--gray-700);border-radius:13px;
  box-shadow:0 12px 40px rgba(0,0,0,.55);padding:6px;z-index:80;
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;
  transition:opacity .16s,transform .16s;
}
.model-sel.open .model-menu{opacity:1;transform:none;pointer-events:auto}
.model-item{padding:9px 12px;border-radius:9px;cursor:pointer;transition:background .12s}
.model-item:hover{background:var(--hover)}
.model-item .nm{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.model-item .ds{font-size:12px;color:var(--gray-500);margin-top:2px}
.model-item.on .nm::after{content:'✓';margin-left:auto;color:var(--accent)}
.top-status{margin-left:auto;font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .3s}
.top-status.show{opacity:1}
.top-status .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}

/* ---- 消息区 ---- */
#chatScroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread{max-width:46rem;margin:0 auto;padding:10px 16px 30px}

/* 欢迎页 */
#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100dvh - 220px);animation:fadeUp .5s ease both}
#welcome h1{font-size:26px;font-weight:600;margin:22px 0 6px;letter-spacing:.5px}
#welcome .sub{color:var(--gray-500);font-size:13.5px;margin-bottom:30px}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px}
.sugg-card{
  display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:13px;cursor:pointer;
  background:transparent;border:1px solid var(--gray-750);text-align:left;color:var(--gray-300);
  font-size:13px;line-height:1.5;transition:background .18s,border-color .18s,transform .18s;
}
.sugg-card:hover{background:var(--hover-card);border-color:var(--gray-600);transform:translateY(-2px)}
.sugg-card .em{font-size:19px;line-height:1;margin-top:1px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 消息 */
.msg-user{display:flex;justify-content:flex-end;margin:18px 0;animation:msgIn .3s ease both}
.msg-user .bubble{
  background:var(--gray-800);border:1px solid var(--border-soft);
  padding:11px 17px;border-radius:20px;border-bottom-right-radius:7px;
  max-width:86%;font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
}
.msg-assistant{display:flex;gap:12px;margin:22px 0;animation:msgIn .35s ease both}
.msg-assistant .ava{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;margin-top:2px;
  background:conic-gradient(from 210deg,var(--accent),var(--accent-2),#ec4899,var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 0 14px rgba(50,122,194,.35);
}
.msg-assistant .ava svg.ic{width:16px;height:16px;fill:#fff;stroke:none}
.msg-assistant .body{flex:1;min-width:0;font-size:14.5px;line-height:1.7}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* markdown 内容 */
.markdown{word-break:break-word}
.markdown>*+*{margin-top:.7em}
.markdown p{line-height:1.75}
.markdown h1,.markdown h2,.markdown h3,.markdown h4{margin-top:1.1em;font-weight:600;line-height:1.4}
.markdown h1{font-size:1.35em}.markdown h2{font-size:1.2em}.markdown h3{font-size:1.08em}
.markdown ul,.markdown ol{padding-left:1.5em}
.markdown li{margin:.28em 0}
.markdown a{color:var(--accent);text-decoration:none}
.markdown a:hover{text-decoration:underline}
.markdown code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:5px;font-size:.88em;font-family:ui-monospace,Menlo,Consolas,monospace}
.markdown pre{background:#141519;border:1px solid #26282e;border-radius:0 0 11px 11px;padding:13px 15px;overflow-x:auto;margin:0}
.markdown pre code{background:none;padding:0;font-size:12.8px;line-height:1.6;color:#d6deeb}
.markdown blockquote{border-left:3px solid var(--gray-700);padding-left:12px;color:var(--gray-400)}
.markdown table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
.markdown th,.markdown td{border:1px solid var(--gray-700);padding:6px 12px;font-size:.92em}
.markdown th{background:var(--gray-800)}
.markdown hr{border:none;border-top:1px solid var(--gray-700);margin:1.2em 0}
.markdown svg{max-width:100%;height:auto;border-radius:10px}

/* 思考过程 */
.think-block{margin-bottom:10px}
.think-head{display:flex;align-items:center;gap:6px;color:var(--gray-500);font-size:12.5px;cursor:pointer;user-select:none;width:fit-content;padding:3px 0;transition:color .15s}
.think-head:hover{color:var(--gray-300)}
.think-head svg.ic{width:13px;height:13px;transition:transform .25s}
.think-block.open .think-head svg.ic{transform:rotate(90deg)}
.think-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.think-block.open .think-wrap{grid-template-rows:1fr}
.think-inner{overflow:hidden}
.think-body{
  color:var(--gray-500);font-size:12.8px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
  border-left:2px solid var(--gray-700);padding:4px 0 4px 13px;margin-top:6px;
  max-height:300px;overflow-y:auto;
}
.think-dots{display:inline-flex;gap:4px;margin-left:4px}
.think-dots i{width:5px;height:5px;border-radius:50%;background:var(--gray-500);animation:dotJump 1.2s infinite}
.think-dots i:nth-child(2){animation-delay:.15s}
.think-dots i:nth-child(3){animation-delay:.3s}
@keyframes dotJump{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* 流式光标 */
.cursor{display:inline-block;width:8px;height:16px;background:var(--accent);border-radius:2px;vertical-align:-2px;margin-left:2px;animation:curBlink 1s steps(2) infinite}
@keyframes curBlink{50%{opacity:0}}

/* 音频气泡 */
.audio-row{display:flex;align-items:center;gap:8px;margin:.55em 0;max-width:360px}
.voice-bubble{
  display:flex;align-items:center;gap:10px;padding:11px 15px;cursor:pointer;min-width:120px;flex:1;
  border-radius:16px;background:var(--gray-800);border:1px solid var(--border-soft);
  transition:background .15s,border-color .15s;
}
.voice-bubble:hover{background:var(--gray-750);border-color:var(--gray-600)}
.voice-icon{font-size:17px;line-height:1}
.voice-bar{flex:1;height:4px;background:var(--gray-700);border-radius:2px;overflow:hidden;min-width:44px}
.voice-bar-inner{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .1s linear}
.voice-duration{font-size:12px;color:var(--gray-500);min-width:34px;text-align:right}
.loop-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--gray-700);background:var(--gray-800);
  color:var(--gray-500);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .18s;
}
.loop-btn:hover{border-color:var(--gray-500);color:var(--gray-100)}
.loop-btn.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px rgba(50,122,194,.4)}

/* 消息操作条 */
.msg-actions{display:flex;gap:2px;margin-top:8px;opacity:0;transition:opacity .2s}
.msg-assistant:hover .msg-actions{opacity:1}
.msg-actions button{
  width:29px;height:29px;border-radius:8px;border:none;background:transparent;color:var(--gray-500);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
}
.msg-actions button:hover{background:var(--hover);color:var(--gray-100)}
.msg-actions button svg.ic{width:15px;height:15px}

.err-bubble{color:#fca5a5;background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.25);padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6}

/* ---- 输入区 ---- */
.input-area{flex-shrink:0;padding:4px 16px 10px}
.input-wrap{max-width:46rem;margin:0 auto;position:relative}
#promptPop{position:absolute;left:0;right:0;bottom:calc(100% - 6px);top:auto;min-width:0;max-height:320px;overflow-y:auto;z-index:95}
.input-box{
  display:flex;align-items:flex-end;gap:8px;padding:9px 10px 9px 18px;
  background:var(--gray-800);border:1px solid var(--gray-750);border-radius:26px;
  transition:border-color .2s,box-shadow .2s;
}
.input-box:focus-within{border-color:var(--gray-600);box-shadow:0 4px 24px rgba(0,0,0,.35)}
#input{
  flex:1;background:transparent;border:none;outline:none;resize:none;
  color:var(--gray-100);font-size:14.5px;line-height:1.55;font-family:inherit;
  max-height:200px;padding:5px 0;
}
#input::placeholder{color:var(--gray-600)}
.send-btn{
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--gray-700);color:var(--gray-500);
  transition:background .2s,color .2s,box-shadow .2s,transform .1s;
}
.send-btn.ready{background:var(--accent);color:#fff;box-shadow:0 0 16px rgba(50,122,194,.5)}
.send-btn.ready:hover{transform:scale(1.07)}
.send-btn.stop{background:var(--gray-100);color:var(--gray-900)}
.send-btn svg.ic{width:17px;height:17px}
.foot-note{text-align:center;color:var(--gray-600);font-size:11.5px;margin-top:8px}

/* ============ 设置弹窗 ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:600px;max-height:88dvh;display:flex;flex-direction:column;
  background:var(--gray-850);border:1px solid var(--gray-750);border-radius:18px;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
  transform:translateY(12px) scale(.97);transition:transform .22s cubic-bezier(.34,1.4,.64,1);
}
.modal-overlay.open .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 12px}
.modal-head h2{font-size:17px;font-weight:600}
.modal-body{overflow-y:auto;padding:4px 22px 18px}
.modal-body section{margin-bottom:22px}
.modal-body h3{font-size:13px;color:var(--gray-400);font-weight:600;margin-bottom:12px;letter-spacing:.4px}
.modal-body label{display:block;font-size:12.5px;color:var(--gray-500);margin:10px 0 5px}
.modal-body input,.modal-body textarea{
  width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--gray-750);
  background:var(--gray-900);color:var(--gray-100);font-size:13.5px;font-family:inherit;outline:none;
  transition:border-color .15s;
}
.modal-body input:focus,.modal-body textarea:focus{border-color:var(--accent)}
.modal-body textarea{min-height:96px;resize:vertical;line-height:1.6}
.hint{font-size:11.5px;color:var(--gray-600);margin-top:6px;line-height:1.6}
.provider-card{background:var(--gray-900);border:1px solid var(--gray-750);border-radius:13px;padding:4px 14px 12px;margin-bottom:10px}
.provider-card .pc-title{font-size:12.5px;color:var(--gray-400);font-weight:600;padding:10px 0 2px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--border-soft)}
.btn{padding:9px 20px;border-radius:10px;border:none;font-size:13.5px;cursor:pointer;transition:filter .15s,background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-ghost{background:transparent;color:var(--gray-400)}
.btn-ghost:hover{background:var(--hover);color:var(--gray-100)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.15)}

/* toast */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--gray-100);color:var(--gray-950);padding:10px 22px;border-radius:999px;
  font-size:13px;font-weight:500;z-index:300;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 遮罩（移动端侧边栏） */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}

/* ============ 文件夹 / 分组 ============ */
.sb-sec-label{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 4px;font-size:11px;color:var(--gray-500);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.sb-sec-label .add-folder{width:20px;height:20px;border:none;border-radius:6px;background:transparent;color:var(--gray-500);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.sb-sec-label .add-folder:hover{background:var(--hover-strong);color:var(--gray-100)}
.sb-sec-label .add-folder svg.ic{width:13px;height:13px}
.folder-head{display:flex;align-items:center;gap:6px;padding:7px 10px 3px;font-size:12px;color:var(--gray-400);font-weight:600;cursor:pointer;user-select:none;border-radius:7px}
.folder-head:hover{background:var(--hover)}
.folder-head .fcaret{transition:transform .2s;width:12px;height:12px;flex-shrink:0}
.folder-head.closed .fcaret{transform:rotate(-90deg)}
.folder-head .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-head .fact{display:none;gap:2px}
.folder-head:hover .fact{display:flex}
.folder-head .fact button{width:20px;height:20px;border:none;border-radius:5px;background:transparent;color:var(--gray-500);cursor:pointer;display:flex;align-items:center;justify-content:center}
.folder-head .fact button:hover{background:var(--hover-strong);color:var(--gray-100)}
.folder-head .fact svg.ic{width:12px;height:12px}
.folder-items{overflow:hidden}
.folder-items.closed{display:none}
.chat-item .move{display:none}
.chat-item .del{opacity:1;position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none}
.chat-item:hover .del{display:flex}
.chat-item{padding-right:34px}

/* ============ 右键/下拉菜单 ============ */
.ctx{position:fixed;z-index:300;min-width:180px;background:var(--gray-800);border:1px solid var(--gray-700);border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.55);padding:5px;display:none;animation:ctxIn .13s ease}
.ctx.open{display:block}
@keyframes ctxIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ctx-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;font-size:13px;color:var(--gray-300);cursor:pointer;transition:background .12s}
.ctx-item:hover{background:var(--hover);color:var(--gray-100)}
.ctx-item.danger{color:#f87171}
.ctx-item.danger:hover{background:rgba(239,68,68,.12)}
.ctx-item svg.ic{width:15px;height:15px}
.ctx-sep{height:1px;background:var(--border-soft);margin:5px 6px}

/* ============ 代码块（带语言标签+复制） ============ */
.code-block{margin:.8em 0;border-radius:11px;overflow:hidden;border:1px solid #26282e;background:#141519}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;background:#1d1f24;border-bottom:1px solid #26282e}
.code-head .lang{font-size:11.5px;color:#8b919e;font-family:ui-monospace,monospace}
.code-head button{display:flex;align-items:center;gap:5px;border:none;background:transparent;color:#8b919e;font-size:11.5px;padding:4px 9px;border-radius:6px;cursor:pointer;transition:background .15s,color .15s}
.code-head button:hover{background:rgba(255,255,255,.08);color:#e6e6e6}
.code-head svg.ic{width:13px;height:13px}
.markdown pre code.hljs{background:transparent;padding:0;display:block}
body.light .code-block{border-color:#e3e4e8;background:#141519}
body.light .code-head{background:#eef0f3;border-bottom:1px solid #e3e4e8}
body.light .code-head .lang{color:#6b7280}
body.light .code-head button{color:#6b7280}
body.light .code-head button:hover{background:rgba(0,0,0,.06);color:#111}

/* ============ Mermaid ============ */
.mermaid-wrap{margin:.8em 0;padding:14px;border-radius:11px;background:var(--gray-800);border:1px solid var(--border-soft);overflow-x:auto;text-align:center}
.mermaid-wrap svg{max-width:100%}
body.light .mermaid-wrap{background:#fff}

/* ============ KaTeX ============ */
.markdown .katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0}
.markdown .katex{font-size:1.08em}

/* ============ 多模型对比 ============ */
.cmp-grid{display:flex;gap:14px;margin:22px 0;align-items:flex-start}
.cmp-col{flex:1;min-width:0;border:1px solid var(--gray-750);border-radius:14px;background:var(--gray-900);padding:14px;animation:msgIn .35s ease both}
.cmp-col .cmp-head{display:flex;align-items:center;gap:8px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border-soft)}
.cmp-col .cmp-name{font-size:12.5px;font-weight:600;color:var(--gray-300);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-col .cmp-badge{font-size:10.5px;color:var(--gray-500);border:1px solid var(--gray-700);padding:2px 7px;border-radius:99px;flex-shrink:0}
.cmp-col .msg-assistant{margin:0;animation:none}
.cmp-col .msg-assistant .ava{display:none}
@media(max-width:900px){.cmp-grid{flex-direction:column}}

/* ============ 提示词 ============ */
.prompt-bar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.prompt-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--gray-750);background:transparent;color:var(--gray-300);font-size:12.5px;cursor:pointer;transition:background .15s,border-color .15s;max-width:220px}
.prompt-chip:hover{background:var(--hover-card);border-color:var(--gray-600)}
.prompt-chip .pt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prompt-chip svg.ic{width:13px;height:13px;color:var(--gray-500);flex-shrink:0}
.prompt-lib{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--gray-750);background:var(--gray-900);color:var(--gray-300);font-size:13px;cursor:pointer;margin-bottom:8px;transition:background .15s;text-align:left}
.prompt-lib:hover{background:var(--hover-card)}
.prompt-lib svg.ic{width:15px;height:15px;color:var(--gray-500)}
.pm-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pm-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--gray-750);border-radius:10px;background:var(--gray-900)}
.pm-item .pmi-body{flex:1;min-width:0}
.pm-item .pmi-title{font-size:13px;font-weight:600;color:var(--gray-100)}
.pm-item .pmi-content{font-size:12px;color:var(--gray-500);margin-top:3px;white-space:pre-wrap;max-height:60px;overflow:hidden;line-height:1.5}
.pm-item .pmi-act{display:flex;gap:4px;flex-shrink:0}
.pm-item .pmi-act button{width:28px;height:28px;border:none;border-radius:7px;background:transparent;color:var(--gray-500);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pm-item .pmi-act button:hover{background:var(--hover-strong);color:var(--gray-100)}
.pm-item .pmi-act svg.ic{width:14px;height:14px}

/* ============ 输入框工具行 ============ */
.input-tools{display:flex;align-items:center;gap:6px;padding:0 6px 6px}
.tool-btn{width:32px;height:32px;border-radius:9px;border:none;background:transparent;color:var(--gray-500);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;position:relative}
.tool-btn:hover{background:var(--hover);color:var(--gray-100)}
.tool-btn svg.ic{width:17px;height:17px}
.tool-btn.active{color:#7fb2e8;background:rgba(50,122,194,.16)}
.tool-btn.active:hover{color:#a8cbef}
.tool-btn .badge{position:absolute;top:-2px;right:-2px;background:var(--accent);color:#fff;font-size:9px;min-width:14px;height:14px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* 联网搜索来源 */
.web-sources{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0 12px}
.ws-label{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--gray-500)}
.ws-label svg.ic{width:13px;height:13px}
.ws-chip{font-size:11.5px;color:var(--gray-400);border:1px solid var(--gray-750);border-radius:99px;padding:3px 10px;text-decoration:none;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.ws-chip:hover{background:var(--hover);color:var(--gray-100);border-color:var(--gray-600)}
.input-box{flex-direction:column;align-items:stretch;padding:8px 10px 8px 12px}
.input-box .ib-row{display:flex;align-items:flex-end;gap:8px}
.input-box .ib-row #input{flex:1}

/* ============ 顶部工具 ============ */
.topbar .spacer{flex:1}
.model-count{background:var(--accent);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;margin-left:6px}

/* ============ 空态/加载 ============ */
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gray-500);animation:dotJump 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}

/* ============ 分享只读模式 ============ */
#shareBanner{display:none;align-items:center;gap:8px;padding:10px 18px;background:var(--gray-900);border-bottom:1px solid var(--border-soft);font-size:13px;color:var(--gray-400)}
#shareBanner b{color:var(--gray-100);font-weight:600}
body.share-mode #shareBanner{display:flex}
body.share-mode #sidebar,body.share-mode .input-area,body.share-mode .topbar{display:none !important}
body.share-mode .msg-actions{display:none !important}

@media (max-width:768px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;margin-left:0 !important;transform:translateX(-102%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:8px 0 40px rgba(0,0,0,.5)}
  #app.sb-open #sidebar{transform:none}
  #app.sb-open #backdrop{opacity:1;pointer-events:auto}
  .sugg{grid-template-columns:1fr}
  #welcome h1{font-size:22px}
  .thread{padding:10px 12px 24px}
}
</style>
</head>
<body>
<div id="app">
  <!-- ======== 侧边栏 ======== -->
  <aside id="sidebar">
    <div class="sb-head">
      <button class="brand" id="btnBrand" title="Easy AI">
        <div class="orb"><span class="spark"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2l1.9 5.7L19.6 9.6l-5.7 1.9L12 17.2l-1.9-5.7L4.4 9.6l5.7-1.9z"/></svg></span></div>
        <span class="brand-name">Easy AI</span>
      </button>
      <button class="icon-btn" id="btnCollapse" title="收起侧边栏">
        <svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <button class="new-chat" id="btnNewChat">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      新对话
    </button>
    <div class="sb-search">
      <input id="searchInput" placeholder="搜索对话 (Ctrl+K)" autocomplete="off">
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="sb-foot">
      <button class="sb-foot-btn" id="btnSettings">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        设置
      </button>
    </div>
  </aside>
  <div id="backdrop"></div>

  <!-- ======== 主区域 ======== -->
  <main id="main">
    <div id="shareBanner">🔗 <b id="shareTitle"></b>&nbsp;· 分享的只读对话</div>
    <header class="topbar">
      <button class="icon-btn" id="btnMenu" title="侧边栏">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="model-sel" id="modelSel">
        <button class="model-btn" id="modelBtn">
          <span id="modelName">自动模式</span>
          <svg class="ic chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="model-menu" id="modelMenu"></div>
      </div>
      <div class="top-status" id="topStatus"><span class="dot"></span><span id="topStatusText">生成中</span></div>
      <button class="icon-btn" id="btnTheme" title="切换主题"></button>
    </header>

    <div id="chatScroll">
      <div class="thread">
        <div id="welcome">
          <div class="orb lg"><span class="spark"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2l1.9 5.7L19.6 9.6l-5.7 1.9L12 17.2l-1.9-5.7L4.4 9.6l5.7-1.9z"/></svg></span></div>
          <h1>有什么可以帮你？</h1>
          <p class="sub">能聊天，还会实时作曲 🎵 和画矢量图 🎨</p>
          <div class="sugg">
            <button class="sugg-card" data-q="画一个红色的爱心，再画一个笑脸"><span class="em">🎨</span><span>画一个红色的爱心，再画一个笑脸</span></button>
            <button class="sugg-card" data-q="用钢琴弹一首小星星"><span class="em">🎹</span><span>用钢琴弹一首小星星</span></button>
            <button class="sugg-card" data-q="来一段低频震撼的鼓点"><span class="em">🥁</span><span>来一段低频震撼的鼓点</span></button>
            <button class="sugg-card" data-q="用铜管乐器吹一段胜利的旋律，并画一面旗帜"><span class="em">🎺</span><span>铜管旋律 + 画一面旗帜</span></button>
          </div>
        </div>
        <div id="messages"></div>
      </div>
    </div>

    <footer class="input-area">
      <div class="input-wrap">
        <div class="prompt-bar" id="promptBar"></div>
        <div class="ctx" id="promptPop"></div>
        <div class="input-box">
          <div class="ib-row">
            <textarea id="input" rows="1" placeholder="给 Easy AI 发送消息（Shift+Enter 换行）" autocomplete="off"></textarea>
            <button class="send-btn" id="btnSend" title="发送">
              <svg class="ic" viewBox="0 0 24 24" id="sendIcon"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
          <div class="input-tools">
            <button class="tool-btn" id="btnWeb" title="联网搜索：回答前先搜网页">
              <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
            </button>
            <button class="tool-btn" id="btnPrompts" title="提示词库">
              <svg class="ic" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
            </button>
            <button class="tool-btn" id="btnExport" title="导出当前对话">
              <svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            </button>
            <button class="tool-btn" id="btnShare" title="生成分享链接">
              <svg class="ic" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
            </button>
            <span class="foot-inline"></span>
          </div>
        </div>
        <p class="foot-note">内容由 AI 生成，请注意甄别 · 音频为浏览器端物理建模实时合成</p>
      </div>
    </footer>
  </main>
</div>

<!-- ======== 设置弹窗 ======== -->

  <div class="modal">
    <div class="modal-head">
      <h2>设置</h2>

      </section>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="setCancel">取消</button>
      <button class="btn btn-primary" id="setSave">保存</button>

<!-- ======== 右键菜单 ======== -->
<div class="ctx" id="ctxMenu"></div>

<div id="toast"></div>

<script>
'use strict';
/* ==================================================================
 * 工具
 * ================================================================== */
const API = 'api.php';
const $ = s => document.querySelector(s);
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
if (window.marked && marked.setOptions) marked.setOptions({breaks:true,gfm:true});

const ICONS = {
  trash:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14"/></svg>',
  copy:'<svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>',
  regen:'<svg class="ic" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>',

function playMIDIBlock(tracks,bpm,ctx,st){
  var bd=60/(bpm||120);

    });
  });

window._midi={};window._loops={};
function voiceHtml(b,plain){
  const inner='<span class="voice-icon">🔊</span><div class="voice-bar"><div class="voice-bar-inner" style="width:0%"></div></div><span class="voice-duration">'+b.label+'</span>';
  if(plain)return'<div class="voice-bubble" data-midi="'+b.id+'">'+inner+'</div>';
  return'<div class="audio-row"><div class="voice-bubble" data-midi="'+b.id+'" onclick="playMidi(this)">'+inner+'</div><button class="loop-btn" onclick="event.stopPropagation();toggleLoop(\''+b.id+'\',this)" title="循环">🔁</button></div>';
}
function ea(content){
  var blocks=[];
  content=content.replace(/```audio\n?([\s\S]*?)```/gi,function(_,code){
    var id='midi_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
    var data=parseMIDI(code);var mt=0;
    data.tracks.forEach(function(t){t.notes.forEach(function(n){var e=(n.time+n.duration)*(60/data.bpm);if(e>mt)mt=e})});
    var tl=Math.ceil(mt);var label=tl>=60?Math.floor(tl/60)+':'+String(tl%60).padStart(2,'0'):tl+'s';
    blocks.push({id:id,data:data,label:label});
    return voiceHtml({id:id,label:label},true);
  });
  return{html:content,blocks:blocks};
}
function toggleLoop(aid,btn){window._loops[aid]=!window._loops[aid];btn.classList.toggle('active',window._loops[aid])}
function rel(el){el.querySelector('.voice-bar-inner').style.width='0%';el.querySelector('.voice-icon').textContent='🔊';if(el._pi){clearInterval(el._pi);el._pi=null}}
window.playMidi=function(el){
  var id=el.getAttribute('data-midi'),data=window._midi[id];
  if(!data||!data.tracks)return;
  if(el._c){el._c.close();el._c=null;if(el._lt)clearTimeout(el._lt);rel(el);return}
  var looping=window._loops[id]||false;
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();window._globalCtx=ctx;el._c=ctx;
    var now=ctx.currentTime;playMIDIBlock(data.tracks,data.bpm,ctx,now);
    var bd=60/(data.bpm||120);var totalDur=0;
    data.tracks.forEach(function(t){t.notes.forEach(function(n){var e=(n.time+n.duration)*bd+0.5;if(e>totalDur)totalDur=e})});
    el.querySelector('.voice-icon').textContent='⏸';
    var bar=el.querySelector('.voice-bar-inner');var startTime=Date.now();var totalMs=totalDur*1000;
    el._pi=setInterval(function(){var elapsed=Date.now()-startTime;var pct=Math.min(100,Math.round(elapsed/totalMs*100));bar.style.width=pct+'%';if(pct>=100||!el._c){clearInterval(el._pi);el._pi=null}},100);
    if(looping){
      var sl=function(){if(!el._c)return;now=ctx.currentTime;playMIDIBlock(data.tracks,data.bpm,ctx,now);startTime=Date.now();totalMs=totalDur*1000;bar.style.width='0%';
        el._pi=setInterval(function(){var elapsed=Date.now()-startTime;var pct=Math.min(100,Math.round(elapsed/totalMs*100));bar.style.width=pct+'%';if(pct>=100||!el._c){clearInterval(el._pi);el._pi=null}},100);
        el._lt=setTimeout(sl,totalMs)};
      el._lt=setTimeout(sl,totalMs);
    }else{
      setTimeout(function(){if(el._c){el._c.close();el._c=null;rel(el)}},totalMs+500);
    }
  }catch(e){console.error(e)}
};

function enhance(root){
  // 1a) mermaid 代码块 → .mermaid-wrap 容器
  root.querySelectorAll('pre').forEach(pre=>{
    const code=pre.querySelector('code');
    if(!code)return;
    const m=code.className.match(/language-([\w+#-]+)/);
    if(m&&m[1]==='mermaid'){
      const wrap=document.createElement('div');wrap.className='mermaid-wrap';
      const d=document.createElement('div');d.className='mermaid';d.textContent=code.textContent;
      wrap.appendChild(d);pre.replaceWith(wrap);
    }
  });
  // 1b) 其余代码块：包上带语言名+复制按钮的头（幂等，已包过的跳过）
  root.querySelectorAll('pre').forEach(pre=>{
    if(pre.closest('.code-block'))return;
    const code=pre.querySelector('code');
    const m=code?code.className.match(/language-([\w+#-]+)/):null;
    const lang=m?m[1]:'code';
    const blk=document.createElement('div');blk.className='code-block';
    const head=document.createElement('div');head.className='code-head';
    const lb=document.createElement('span');lb.className='lang';lb.textContent=lang;
    const bt=document.createElement('button');bt.innerHTML=ICONS.copy+'<span>复制</span>';
    bt.addEventListener('click',()=>{
      const src=(pre.querySelector('code')||pre).textContent;
      if(navigator.clipboard)navigator.clipboard.writeText(src).then(()=>toast('已复制')).catch(()=>toast('复制失败'));
    });
    head.appendChild(lb);head.appendChild(bt);
    pre.replaceWith(blk);blk.appendChild(head);blk.appendChild(pre);
  });
  // 1c) 高亮所有尚未高亮的代码（库延迟就绪时，二次调用在此补齐）
  if(window.hljs){
    root.querySelectorAll('.code-block pre code:not(.hljs)').forEach(code=>{

}

/* 增强库延迟加载：hljs / katex / auto-render / mermaid，不阻塞首屏 */
function loadScript(src){
  return new Promise(res=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>res(true);
    s.onerror=()=>res(false);
    document.head.appendChild(s);
    setTimeout(()=>res(false),20000);
  });
}
async function loadLibs(){
  const KATEX='https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/';
  await Promise.race([
    Promise.all([
      loadScript('https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js'),
      loadScript(KATEX+'katex.min.js').then(ok=>ok?loadScript(KATEX+'contrib/auto-render.min.js'):false),
      loadScript('https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js')
    ]),
    new Promise(r=>setTimeout(r,12000))
  ]);
  initMermaid();
}

/* ---------- 富文本渲染 ---------- */
function renderRich(content){
  const ar=ea(content||'');
  let raw=ar.html;
  // photo 块先在原始文本上替换（此时换行还是 \n），再交给 marked，避免 <br> 破坏图形指令
  raw=raw.replace(/【photo】\s*([\s\S]*?)\s*【\/photo】/gi,(_,c)=>'\n\n'+parsePhoto(c)+'\n\n');
  let html=window.marked?marked.parse(raw):esc(raw);
  html=html.replace(/【photo】\s*([\s\S]*?)\s*【\/photo】/gi,(_,c)=>parsePhoto(c));
  ar.blocks.forEach(b=>{
    window._midi[b.id]=b.data;window._loops[b.id]=false;
    html=html.split(voiceHtml({id:b.id,label:b.label},true)).join(voiceHtml(b,false));
  });
  const div=document.createElement('div');
  div.className='markdown';
  div.innerHTML=html;
  enhance(div);
  return div;
}

async function send(text,regen){
  text=(text!==undefined?text:inputEl.value).trim();
  if(!text||streaming)return;
  const usable=(CONFIG&&CONFIG.providers||[]).filter(p=>p.url&&p.model&&p.key);
  if(!usable.length){toast('请先在设置中配置 API 线路');openSettings();return}

  showWelcome(false);
  if(!regen){
    messages.push({role:'user',content:text});
    appendUser(text);
  }
  inputEl.value='';autoResize();updateInputUI();

  const el=appendAssistantShell();
  const body=el.querySelector('.body');
  body.innerHTML='<div class="think-head" style="cursor:default">正在思考<span class="think-dots"><i></i><i></i><i></i></span></div>';

  setStreamingUI(true);
  $('#topStatusText').textContent=webEnabled?'正在联网搜索…':'生成中';
  aborter=new AbortController();
  let content='',thinking='',errMsg='',thinkStart=Date.now(),thinkTimer=null,thinkBlock=null,contentStarted=false,webResults=null;

  try{
    const resp=await fetch(API+'?action=generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:messages.map(m=>({role:m.role,content:m.content})),provider:activeProvider,web:webEnabled}),
      signal:aborter.signal
    });
    if(!resp.ok||!resp.body){
      let detail='';
      try{const j=await resp.json();detail=j.error||''}catch(e){}
      throw new Error(detail||('请求失败 (HTTP '+resp.status+')'));
    }
    const reader=resp.body.getReader();
    const dec=new TextDecoder();
    let buf='',finished=false;
    while(!finished){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,idx).trim();
        buf=buf.slice(idx+1);
        if(!line.startsWith('data:'))continue;
        const payload=line.slice(5).trim();
        if(payload==='[DONE]'){finished=true;break}
        let ev;try{ev=JSON.parse(payload)}catch(e){continue}
        if(ev.error){errMsg=ev.error;finished=true;break}
        if(ev.web_results){webResults=ev.web_results;renderWebSources(el,webResults);continue}
        if(ev.meta){$('#topStatusText').textContent='生成中 · '+ev.model;continue}
        const d=ev.choices&&ev.choices[0]&&ev.choices[0].delta;
        if(!d)continue;
        if(d.reasoning_content){
          thinking+=d.reasoning_content;
          if(!contentStarted){
            if(!thinkBlock){
              body.innerHTML='';
              thinkBlock=makeThinking(thinking,true,0);
              body.appendChild(thinkBlock);
              thinkTimer=setInterval(()=>{
                const lb=thinkBlock.querySelector('.think-label');
                if(lb)lb.textContent='正在思考 '+Math.round((Date.now()-thinkStart)/1000)+'s';
              },1000);
            }
            thinkBlock.querySelector('.think-body').textContent=thinking;
            scrollBottom();
          }
        }
        if(d.content){
          if(!contentStarted){
            contentStarted=true;
            if(thinkTimer){clearInterval(thinkTimer);thinkTimer=null}
            if(thinkBlock){
              const secs=Math.max(1,Math.round((Date.now()-thinkStart)/1000));
              thinkBlock.classList.remove('open');
              thinkBlock.querySelector('.think-label').textContent='已深度思考 '+secs+'s';
              const dots=thinkBlock.querySelector('.think-dots');if(dots)dots.remove();
            }
            const md=document.createElement('div');md.className='markdown live';body.appendChild(md);
          }
          content+=d.content;
          const liveEl=body.querySelector('.markdown.live');
          if(liveEl){
            liveEl.innerHTML=(window.marked?marked.parse(content):esc(content))+'<span class="cursor"></span>';
            scrollBottom();
          }
        }
      }
    }
  }catch(e){
    if(e.name!=='AbortError')errMsg=errMsg||e.message;
  }
  if(thinkTimer)clearInterval(thinkTimer);
  setStreamingUI(false);

  const aborted=aborter&&aborter.signal.aborted;
  if(content){
    const liveEl=body.querySelector('.markdown.live');if(liveEl)liveEl.remove();
    messages.push({role:'assistant',content,thinking});
    buildAssistantContent(el,content,thinking);
    if(webResults)renderWebSources(el,webResults);
    saveChat();
  }else{
    el.remove();
    if(!regen){/* 保留用户消息 */}
    if(errMsg)appendError(errMsg);
    else if(aborted)appendError('已停止生成');
    else appendError('服务暂不可用');
  }
  updateInputUI();
}

async function streamColumn(c){
  const payload={messages:messages.map(m=>({role:m.role,content:m.content})),provider:c.i,strict:true};
  let thinkBlock=null,contentStarted=false,errMsg='';
  try{
    const resp=await fetch(API+'?action=generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),
      signal:aborter.signal
    });
    if(!resp.ok||!resp.body){
      let detail='';
      try{const j=await resp.json();detail=j.error||''}catch(e){}
      throw new Error(detail||('请求失败 (HTTP '+resp.status+')'));
    }
    const reader=resp.body.getReader();
    const dec=new TextDecoder();
    let buf='',fin=false;
    while(!fin){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,idx).trim();
        buf=buf.slice(idx+1);
        if(!line.startsWith('data:'))continue;
        const pl=line.slice(5).trim();
        if(pl==='[DONE]'){fin=true;break}
        let ev;try{ev=JSON.parse(pl)}catch(e){continue}
        if(ev.error){errMsg=ev.error;fin=true;break}
        if(ev.meta)continue;
        const d=ev.choices&&ev.choices[0]&&ev.choices[0].delta;
        if(!d)continue;
        if(d.reasoning_content){
          c.thinking+=d.reasoning_content;
          if(!contentStarted){
            if(!thinkBlock){
              c.el.innerHTML='';
              thinkBlock=makeThinking(c.thinking,true,null);
              thinkBlock.querySelector('.think-label').textContent='思考中';
              c.el.appendChild(thinkBlock);
            }else{
              thinkBlock.querySelector('.think-body').textContent=c.thinking;
            }
            scrollBottom();
          }
        }
        if(d.content){
          if(!contentStarted){
            contentStarted=true;
            if(thinkBlock)thinkBlock.classList.remove('open');
            const md=document.createElement('div');md.className='markdown live';
            c.el.appendChild(md);
          }
          c.content+=d.content;
          const lv=c.el.querySelector('.markdown.live');
          if(lv){lv.innerHTML=(window.marked?marked.parse(c.content):esc(c.content))+'<span class="cursor"></span>';scrollBottom()}
        }
      }
    }
  }catch(e){
    if(e.name!=='AbortError')errMsg=errMsg||e.message;
    else if(!c.content)errMsg='已停止';
  }
  const lv=c.el.querySelector('.markdown.live');if(lv)lv.remove();
  c.el.innerHTML='';
  if(c.content){
    if(c.thinking)c.el.appendChild(makeThinking(c.thinking,false,null));
    c.el.appendChild(renderRich(c.content));
    const act=document.createElement('div');
    act.className='msg-actions';act.style.opacity='1';
    act.innerHTML='<button title="复制">'+ICONS.copy+'</button>';
    act.querySelector('button').addEventListener('click',()=>{
      if(navigator.clipboard)navigator.clipboard.writeText(c.content).then(()=>toast('已复制')).catch(()=>toast('复制失败'));
    });
    c.el.appendChild(act);
  }else{
    c.el.innerHTML='<div class="err-bubble">'+esc(errMsg||'无内容')+'</div>';
  }
  scrollBottom();
}

function regenerate(){
  if(streaming)return;
  let i=messages.length-1;
  while(i>=0&&messages[i].role!=='user')i--;
  if(i<0)return;
  const txt=messages[i].content;
  messages=messages.slice(0,i+1);
  // 移除最后一条 assistant DOM
  const all=boxEl.querySelectorAll('.msg-assistant');
  if(all.length)all[all.length-1].remove();
  send(txt,true);
}

function persistCollapsed(){
  localStorage.setItem('ea_folders_closed',JSON.stringify([...collapsedFolders]));
}
function renderChatList(){
  const list=$('#chatList');
  list.innerHTML='';
  // 搜索模式：平铺结果
  if(searchQuery){
    const lb=document.createElement('div');lb.className='group-label';lb.textContent='搜索结果';
    list.appendChild(lb);
    if(!chats.length){
      list.appendChild(Object.assign(document.createElement('div'),{className:'empty-hint',textContent:'没有找到匹配的对话'}));
      return;
    }
    chats.forEach(c=>list.appendChild(chatItemEl(c)));
    return;
  }
  if(!chats.length&&!folders.length){
    list.innerHTML='<div class="empty-hint">暂无对话<br>点击「新对话」开始创作</div>';
    return;
  }
  // 文件夹区
  const sec=document.createElement('div');sec.className='sb-sec-label';
  sec.innerHTML='<span>文件夹</span>';
  const addBtn=document.createElement('button');
  addBtn.className='add-folder';addBtn.title='新建文件夹';addBtn.innerHTML=ICONS.folderPlus;
  addBtn.addEventListener('click',()=>askMini('新建文件夹','',async name=>{
    if(!name)return;
    try{
      const r=await fetch(API+'?action=folder_save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
      const d=await r.json();
      if(!d.ok)throw new Error(d.error);
      await loadFolders();renderChatList();toast('文件夹已创建');
    }catch(e){toast('创建失败：'+e.message)}
  }));
  sec.appendChild(addBtn);
  list.appendChild(sec);
  folders.forEach(f=>{
    const closed=collapsedFolders.has(f.id);
    const head=document.createElement('div');
    head.className='folder-head'+(closed?' closed':'');
    head.innerHTML='<svg class="ic fcaret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><span class="fname"></span><span class="fact"><button class="fren" title="重命名">'+ICONS.edit+'</button><button class="fdel" title="删除文件夹">'+ICONS.trash+'</button></span>';
    head.querySelector('.fname').textContent=f.name;
    head.addEventListener('click',e=>{
      if(e.target.closest('.fact'))return;
      if(collapsedFolders.has(f.id))collapsedFolders.delete(f.id);
      else collapsedFolders.add(f.id);
      persistCollapsed();renderChatList();
    });
    head.querySelector('.fren').addEventListener('click',e=>{
      e.stopPropagation();
      askMini('重命名文件夹',f.name,async name=>{
        if(!name)return;
        await fetch(API+'?action=folder_save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:f.id,name})});
        await loadFolders();renderChatList();
      });
    });
    head.querySelector('.fdel').addEventListener('click',async e=>{
      e.stopPropagation();
      await fetch(API+'?action=folder_delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:f.id})});
      collapsedFolders.delete(f.id);persistCollapsed();
      await Promise.all([loadFolders(),loadChats()]);
      toast('文件夹已删除，对话移回未分组');
    });
    const itemsWrap=document.createElement('div');
    itemsWrap.className='folder-items'+(closed?' closed':'');
    chats.filter(c=>c.folder===f.id).forEach(c=>itemsWrap.appendChild(chatItemEl(c)));
    list.appendChild(head);
    list.appendChild(itemsWrap);
  });
  // 未分组
  const un=chats.filter(c=>!c.folder);
  if(un.length){
    const lb=document.createElement('div');lb.className='sb-sec-label';lb.innerHTML='<span>对话</span>';
    list.appendChild(lb);
    un.forEach(c=>list.appendChild(chatItemEl(c)));
  }
}

function openCtx(x,y,items){
  const menu=$('#ctxMenu');
  menu.innerHTML='';
  items.forEach(it=>{
    if(it.sep){const s=document.createElement('div');s.className='ctx-sep';menu.appendChild(s);return}
    if(it.label){const l=document.createElement('div');l.className='ctx-label';l.textContent=it.label;menu.appendChild(l);return}
    const d=document.createElement('div');
    d.className='ctx-item'+(it.danger?' danger':'');
    d.innerHTML=(it.icon||'<span style="width:15px"></span>')+'<span></span>';
    d.querySelectorAll('span').forEach((s,i,a)=>{if(i===a.length-1)s.textContent=it.text});
    d.addEventListener('click',e=>{e.stopPropagation();closeCtx();if(it.onClick)it.onClick()});
    menu.appendChild(d);
  });
  menu.classList.add('open');
  const r=menu.getBoundingClientRect();
  menu.style.left=Math.max(8,Math.min(x,window.innerWidth-r.width-8))+'px';
  menu.style.top=Math.max(8,Math.min(y,window.innerHeight-r.height-8))+'px';
}
function closeCtx(){$('#ctxMenu').classList.remove('open')}
document.addEventListener('click',e=>{if(!e.target.closest('#ctxMenu'))closeCtx()});
window.addEventListener('resize',closeCtx);

function openChatCtx(e,c){
  const r=e.currentTarget.getBoundingClientRect();
  const items=[{icon:ICONS.folder,label:'移动到文件夹'}];
  folders.forEach(f=>items.push({icon:'',text:f.name,onClick:()=>moveChat(c.id,f.id)}));
  items.push({icon:'',text:'未分组',onClick:()=>moveChat(c.id,'')});
  items.push({sep:true});
  items.push({icon:ICONS.download,text:'导出 Markdown',onClick:()=>exportChat(c.id,'md')});
  items.push({icon:ICONS.download,text:'导出 JSON',onClick:()=>exportChat(c.id,'json')});
  items.push({icon:ICONS.share,text:'复制分享链接',onClick:()=>shareChat(c.id)});
  items.push({sep:true});
  items.push({icon:ICONS.trash,text:'删除',danger:true,onClick:()=>deleteChat(c.id)});
  openCtx(r.left,r.bottom+4,items);
}
async function moveChat(id,folder){
  try{await fetch(API+'?action=chat_move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,folder})})}catch(e){}
  await loadChats();
}
async function fetchFullChat(id){
  const resp=await fetch(API+'?action=chat&id='+encodeURIComponent(id));
  if(!resp.ok)throw new Error('加载失败');
  return resp.json();
}
function download(name,text,mime){
  const blob=new Blob([text],{type:mime+';charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name.replace(/[\\/:*?"<>|]/g,'_');
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('已导出');
}
async function exportChat(id,fmt){
  let c;
  try{c=await fetchFullChat(id)}catch(e){toast('导出失败');return}
  if(fmt==='json'){download((c.title||'chat')+'.json',JSON.stringify(c,null,2),'application/json');return}
  let md='# '+(c.title||'对话')+'\n\n';
  (c.messages||[]).forEach(m=>{
    md+='**'+(m.role==='user'?'👤 用户':'🤖 '+(CONFIG&&CONFIG.name?CONFIG.name:'AI'))+'**：\n\n'+m.content+'\n\n---\n\n';
  });
  download((c.title||'chat')+'.md',md,'text/markdown');
}
async function shareChat(id){
  try{
    const resp=await fetch(API+'?action=share',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const d=await resp.json();
    if(!d.ok)throw new Error(d.error||'分享失败');
    const url=location.origin+location.pathname+'?s='+d.token;
    if(navigator.clipboard)await navigator.clipboard.writeText(url);
    toast('分享链接已复制到剪贴板');
  }catch(e){toast('分享失败：'+e.message)}
}
async function openChat(id){
  if(streaming)return;
  try{
    const resp=await fetch(API+'?action=chat&id='+encodeURIComponent(id));
    if(!resp.ok)throw 0;
    const c=await resp.json();
    currentId=c.id;
    messages=c.messages||[];
    boxEl.innerHTML='';
    showWelcome(false);
    messages.forEach(m=>{
      if(m.role==='user')appendUser(m.content);
      else appendAssistantFinal(m);
    });
    renderChatList();
    scrollBottom();
    closeSidebarMobile();
  }catch(e){toast('加载会话失败')}
}
function newChat(){
  if(streaming)return;
  currentId=null;
  messages=[];
  boxEl.innerHTML='';
  showWelcome(true);
  renderChatList();
  closeSidebarMobile();
  inputEl.focus();
}

/* ==================================================================
 * 设置
 * ================================================================== */
async function loadConfig(){
  try{
    const resp=await fetch(API+'?action=config');
    CONFIG=await resp.json();
  }catch(e){CONFIG={name:'Easy AI',prompt:'',providers:[{url:'',key:'',model:''},{url:'',key:'',model:''},{url:'',key:'',model:''}]}}
  document.title=CONFIG.name||'Easy AI';
  buildModelMenu();
}
function buildModelMenu(){
  const menu=$('#modelMenu');
  menu.innerHTML='';
  // 自动模式（清空多选）
  const auto=document.createElement('div');
  auto.className='model-item'+(selectedModels.size===0?' on':'');
  auto.innerHTML='<div class="nm"><span class="chk" style="visibility:hidden"></span>自动模式</div><div class="ds">按线路顺序自动故障转移</div>';
  auto.addEventListener('click',e=>{
    e.stopPropagation();
    selectedModels.clear();
    syncModelBtn();
    menu.parentElement.classList.remove('open');
  });
  menu.appendChild(auto);
  // 各线路（多选 = 并排对比）
  (CONFIG.providers||[]).forEach((p,i)=>{
    if(!p.url||!p.model)return;
    const it=document.createElement('div');
    it.className='model-item'+(selectedModels.has(i)?' on':'');
    it.innerHTML='<div class="nm"><span class="chk"></span><span class="mt"></span></div><div class="ds"></div>';
    it.querySelector('.mt').textContent=p.model;
    it.querySelector('.ds').textContent='线路 '+(i+1)+' · '+p.url.replace(/^https?:\/\//,'').split('/')[0];
    it.addEventListener('click',e=>{
      e.stopPropagation();
      if(selectedModels.has(i))selectedModels.delete(i);
      else selectedModels.add(i);
      syncModelBtn();
    });
    menu.appendChild(it);
  });
  const hint=document.createElement('div');
  hint.className='model-hint';
  hint.textContent='勾选 1 个 = 指定线路 · 勾选多个 = 并排对比';
  menu.appendChild(hint);
  syncModelBtn();
}
function syncModelBtn(){
  const nameEl=$('#modelName');
  activeProvider=-1;
  if(selectedModels.size===1){
    const i=[...selectedModels][0];
    activeProvider=i;
    nameEl.textContent=(CONFIG.providers[i]&&CONFIG.providers[i].model)||'指定线路';
  }else if(selectedModels.size>=2){
    nameEl.textContent='对比模式 · '+selectedModels.size+' 个模型';
  }else{
    nameEl.textContent='自动模式';
  }
  // 刷新菜单勾选态
  const items=$('#modelMenu').querySelectorAll('.model-item');
  items.forEach(it=>it.classList.remove('on'));
  if(items.length){
    if(selectedModels.size===0)items[0].classList.add('on');
    else{
      let k=1;
      (CONFIG.providers||[]).forEach((p,i)=>{
        if(!p.url||!p.model)return;
        if(items[k]&&selectedModels.has(i))items[k].classList.add('on');
        k++;
      });
    }
  }
}
function openSettings(){
  $('#cfgName').value=CONFIG.name||'';
  $('#cfgPrompt').value=CONFIG.prompt||'';
  const wrap=$('#providerList');
  wrap.innerHTML='';
  (CONFIG.providers||[]).forEach((p,i)=>{
    const card=document.createElement('div');
    card.className='provider-card';
    card.innerHTML='<div class="pc-title">线路 '+(i+1)+'</div>'
      +'<label>API URL</label><input class="p-url" placeholder="https://api.openai.com/v1/chat/completions">'
      +'<label>API Key</label><input class="p-key" type="password" placeholder="留空保持不变">'
      +'<label>模型</label><input class="p-model" placeholder="gpt-4o-mini">';
    card.querySelector('.p-url').value=p.url||'';
    card.querySelector('.p-key').value=p.key||'';
    card.querySelector('.p-model').value=p.model||'';
    wrap.appendChild(card);
  });
  $('#setOverlay').classList.add('open');
}
function closeSettings(){$('#setOverlay').classList.remove('open')}
async function saveSettings(){
  const providers=Array.from(document.querySelectorAll('.provider-card')).map(card=>({
    url:card.querySelector('.p-url').value.trim(),
    key:card.querySelector('.p-key').value.trim(),
    model:card.querySelector('.p-model').value.trim()
  }));
  try{
    const resp=await fetch(API+'?action=config',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:$('#cfgName').value.trim(),prompt:$('#cfgPrompt').value.trim(),providers})
    });
    const d=await resp.json();
    if(d.ok){
      toast('设置已保存');
      closeSettings();
      await loadConfig();
    }else toast(d.error||'保存失败');
  }catch(e){toast('保存失败：网络错误')}
}

/* ==================================================================
 * 提示词库
 * ================================================================== */
async function loadPrompts(){
  try{const r=await fetch(API+'?action=prompts');const d=await r.json();prompts=d.prompts||[]}catch(e){prompts=[]}
  renderPromptBar();
}
function renderPromptBar(){
  const bar=$('#promptBar');
  bar.innerHTML='';
  prompts.slice(0,4).forEach(p=>{
    const chip=document.createElement('button');
    chip.className='prompt-chip';chip.title=p.content;
    chip.innerHTML=ICONS.book+'<span class="pt"></span>';
    chip.querySelector('.pt').textContent=p.title;
    chip.addEventListener('click',()=>insertPrompt(p));
    bar.appendChild(chip);
  });
  const mg=document.createElement('button');
  mg.className='prompt-chip';
  mg.innerHTML=ICONS.folderPlus+'<span class="pt">提示词库</span>';
  mg.addEventListener('click',openPromptManager);
  bar.appendChild(mg);
}
function insertPrompt(p){
  inputEl.value=p.content;
  autoResize();updateInputUI();inputEl.focus();
}
function togglePromptPop(){
  const pop=$('#promptPop');
  if(pop.classList.contains('open')){pop.classList.remove('open');return}
  pop.innerHTML='';
  if(!prompts.length){
    pop.innerHTML='<div class="prompt-empty" style="padding:14px;text-align:center;color:var(--gray-500);font-size:12.5px">还没有提示词，去提示词库创建一个</div>';
  }
  prompts.forEach(p=>{
    const it=document.createElement('div');
    it.className='ctx-item';it.title=p.content;
    it.innerHTML=ICONS.book+'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>';
    it.querySelector('span').textContent=p.title;
    it.addEventListener('click',e=>{e.stopPropagation();pop.classList.remove('open');insertPrompt(p)});
    pop.appendChild(it);
  });
  const sep=document.createElement('div');sep.className='ctx-sep';pop.appendChild(sep);
  const mg=document.createElement('div');
  mg.className='ctx-item';
  mg.innerHTML=ICONS.edit+'<span></span>';
  mg.querySelector('span').textContent='管理提示词库';
  mg.addEventListener('click',e=>{e.stopPropagation();pop.classList.remove('open');openPromptManager()});
  pop.appendChild(mg);
  pop.classList.add('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#promptPop')&&!e.target.closest('#btnPrompts'))$('#promptPop').classList.remove('open');
});
function openPromptManager(){$('#pmOverlay').classList.add('open');renderPmList()}
function closePromptManager(){$('#pmOverlay').classList.remove('open')}
function renderPmList(){
  const list=$('#pmList');
  list.innerHTML='';
  if(!prompts.length){list.innerHTML='<div class="hint">暂无提示词</div>';return}
  prompts.forEach(p=>{
    const it=document.createElement('div');
    it.className='pm-item';
    it.innerHTML='<div class="pmi-body"><div class="pmi-title"></div><div class="pmi-content"></div></div>'
      +'<div class="pmi-act"><button class="us" title="使用">'+ICONS.book+'</button><button class="ed" title="编辑">'+ICONS.edit+'</button><button class="dl" title="删除">'+ICONS.trash+'</button></div>';
    it.querySelector('.pmi-title').textContent=p.title;
    it.querySelector('.pmi-content').textContent=p.content;
    it.querySelector('.us').addEventListener('click',()=>{insertPrompt(p);closePromptManager()});
    it.querySelector('.ed').addEventListener('click',()=>{
      $('#pmId').value=p.id;$('#pmTitle').value=p.title;$('#pmContent').value=p.content;
      $('#pmTitle').focus();
    });
    it.querySelector('.dl').addEventListener('click',async()=>{
      await fetch(API+'?action=prompt_delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:p.id})});
      await loadPrompts();renderPmList();toast('已删除');
    });
    list.appendChild(it);
  });
}
async function savePromptForm(){
  const title=$('#pmTitle').value.trim(),content=$('#pmContent').value.trim(),id=$('#pmId').value;
  if(!title||!content){toast('标题和内容不能为空');return}
  try{
    const r=await fetch(API+'?action=prompt_save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,title,content})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'保存失败');
    $('#pmId').value='';$('#pmTitle').value='';$('#pmContent').value='';
    await loadPrompts();renderPmList();toast('已保存');
  }catch(e){toast('保存失败：'+e.message)}
}
$('#btnPrompts').addEventListener('click',e=>{e.stopPropagation();togglePromptPop()});
$('#pmClose').addEventListener('click',closePromptManager);
$('#pmSave').addEventListener('click',savePromptForm);
$('#pmReset').addEventListener('click',()=>{$('#pmId').value='';$('#pmTitle').value='';$('#pmContent').value=''});
$('#pmOverlay').addEventListener('click',e=>{if(e.target.id==='pmOverlay')closePromptManager()});

  $('#miniInput').value=val||'';

function closeMini(){$('#miniOverlay').classList.remove('open');miniOkCb=null}

$('#miniOverlay').addEventListener('click',e=>{if(e.target.id==='miniOverlay')closeMini()});
$('#miniInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#miniOk').click()}});

/* ==================================================================
 * 主题切换
 * ================================================================== */
function applyTheme(t){
  document.body.classList.toggle('light',t==='light');
  localStorage.setItem('ea_theme',t);
  $('#btnTheme').innerHTML=(t==='light')?ICONS.moon:ICONS.sun;
  initMermaid();
}
$('#btnTheme').addEventListener('click',()=>applyTheme(document.body.classList.contains('light')?'dark':'light'));

/* ==================================================================
 * 搜索
 * ================================================================== */
$('#searchInput').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  const q=e.target.value.trim();
  searchTimer=setTimeout(async()=>{
    searchQuery=q;
    if(!q){await loadChats();return}
    try{
      const r=await fetch(API+'?action=chats&q='+encodeURIComponent(q));
      const d=await r.json();chats=d.chats||[];
    }catch(e2){chats=[]}
    renderChatList();
  },260);
});

/* ==================================================================
 * 工具栏：联网搜索 / 导出 / 分享
 * ================================================================== */
function syncWebBtn(){
  $('#btnWeb').classList.toggle('active',webEnabled);
  $('#btnWeb').title=webEnabled?'联网搜索：开（回答前先搜网页）':'联网搜索：关';
}
$('#btnWeb').addEventListener('click',()=>{
  webEnabled=!webEnabled;
  localStorage.setItem('ea_web',webEnabled?'1':'0');
  syncWebBtn();
  toast(webEnabled?'联网搜索已开启':'联网搜索已关闭');
});
$('#btnExport').addEventListener('click',e=>{
  if(!currentId){toast('当前没有可导出的对话');return}
  const r=e.currentTarget.getBoundingClientRect();
  openCtx(r.left,r.top-8,[
    {icon:ICONS.download,text:'导出 Markdown',onClick:()=>exportChat(currentId,'md')},
    {icon:ICONS.download,text:'导出 JSON',onClick:()=>exportChat(currentId,'json')}
  ]);
  // 向上弹出
  const menu=$('#ctxMenu');
  const mr=menu.getBoundingClientRect();
  menu.style.top=Math.max(8,r.top-mr.height-6)+'px';
});
$('#btnShare').addEventListener('click',()=>{
  if(!currentId){toast('当前没有可分享的对话');return}
  shareChat(currentId);
});

/* ==================================================================
 * 分享只读模式
 * ================================================================== */
async function initShareMode(token){
  document.body.classList.add('share-mode');
  try{
    const r=await fetch(API+'?action=share&token='+encodeURIComponent(token));
    if(!r.ok)throw new Error('not found');
    const s=await r.json();
    $('#shareTitle').textContent=s.title||'分享对话';
    document.title=(s.title||'分享对话')+' · Easy AI';
    showWelcome(false);
    (s.messages||[]).forEach(m=>{
      if(m.role==='user')appendUser(m.content);
      else appendAssistantFinal(m);
    });
    scrollBottom();
  }catch(e){
    showWelcome(false);
    boxEl.innerHTML='<div class="err-bubble" style="margin:60px auto;max-width:420px">分享不存在或已被删除</div>';
  }
}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#searchInput').focus()}

function isMobile(){return window.innerWidth<=768}

  if(isMobile())$('#app').classList.remove('sb-open');

});
$('#btnMenu').addEventListener('click',()=>{

});
$('#backdrop').addEventListener('click',()=>$('#app').classList.remove('sb-open'));
$('#btnBrand').addEventListener('click',()=>{

$('#btnSettings').addEventListener('click',openSettings);
$('#setClose').addEventListener('click',closeSettings);
$('#setCancel').addEventListener('click',closeSettings);
$('#setSave').addEventListener('click',saveSettings);
$('#setOverlay').addEventListener('click',e=>{if(e.target.id==='setOverlay')closeSettings()});
$('#modelBtn').addEventListener('click',e=>{e.stopPropagation();$('#modelSel').classList.toggle('open')});
document.addEventListener('click',()=>$('#modelSel').classList.remove('open'));
document.querySelectorAll('.sugg-card').forEach(c=>{
  c.addEventListener('click',()=>dispatchSend(c.dataset.q));
});

function dispatchSend(text){
  if(selectedModels.size>=2&&!streaming)return sendCompare(text);
  return send(text);
}

btnSend.addEventListener('click',()=>{
  if(streaming){if(aborter)aborter.abort();return}
  dispatchSend();
});
inputEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();dispatchSend()}
});
inputEl.addEventListener('input',()=>{autoResize();updateInputUI()});
function autoResize(){
  inputEl.style.height='auto';
  inputEl.style.height=Math.min(inputEl.scrollHeight,200)+'px';
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSettings();$('#modelSel').classList.remove('open')}
});

/* ==================================================================
 * 启动
 * ================================================================== */
(async function init(){
  const shareToken=new URLSearchParams(location.search).get('s');
  if(shareToken){
    applyTheme(localStorage.getItem('ea_theme')||'dark');
    // 增强库就绪后重渲染，保证分享页代码/图表正常
    loadLibs().then(()=>{
      document.querySelectorAll('#messages .markdown').forEach(el=>enhance(el));
    });
    await initShareMode(shareToken);
    return;
  }
  applyTheme(localStorage.getItem('ea_theme')||'dark');
  // 后台加载增强库，就绪后刷新当前消息区
  loadLibs().then(()=>{
    document.querySelectorAll('#messages .markdown').forEach(el=>enhance(el));
  });
  await loadConfig();
  await Promise.all([loadFolders(),loadPrompts(),loadChats()]);
  renderChatList();
  syncWebBtn();
  showWelcome(true);
  inputEl.focus();
})();
</script>
